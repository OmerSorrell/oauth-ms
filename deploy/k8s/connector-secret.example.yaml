# Example secret manifest. Do NOT commit a real version of this file with values filled in.
# Apply with:
#   cp connector-secret.example.yaml connector-secret.yaml
#   # edit values
#   kubectl apply -f connector-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: connector-secrets
  namespace: oauth-ms
type: Opaque
stringData:
  OAUTH_MS_PROVIDERS_GITHUB_CLIENT_ID: "REPLACE_ME"
  OAUTH_MS_PROVIDERS_GITHUB_CLIENT_SECRET: "REPLACE_ME"
  OAUTH_MS_INTERNAL_API_KEY: "super-secret-key"
