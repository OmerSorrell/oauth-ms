<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OAuth Connector — Universal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #111827;
      --muted: #4b5563;
      --border: #e5e7eb;
      --row-hover: #f9fafb;
      --pill-bg: #eef2ff;
      --pill-fg: #3730a3;
      --err-bg: #fef2f2;
      --err-fg: #991b1b;
      --err-border: #fecaca;
      --btn-border: #d1d5db;
      --btn-hover: #f3f4f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --border: #1f2937;
        --row-hover: #111827;
        --pill-bg: #1e293b;
        --pill-fg: #c7d2fe;
        --err-bg: #2a1414;
        --err-fg: #fecaca;
        --err-border: #7f1d1d;
        --btn-border: #374151;
        --btn-hover: #1f2937;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --primary-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--fg); }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1.25rem 3rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: 1.75rem; font-weight: 700; margin: 0 0 .25rem; letter-spacing: -0.01em; }
    h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
    button, .btn {
      font: inherit;
      font-weight: 500;
      padding: .55rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--btn-border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease;
    }
    button:hover, .btn:hover { background: var(--btn-hover); }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-fg);
      border-color: var(--primary);
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .row { display: flex; gap: .75rem; align-items: center; }
    .muted { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: .85em; text-transform: uppercase; letter-spacing: .03em; }
    tbody tr:hover { background: var(--row-hover); }
    .stars { font-variant-numeric: tabular-nums; text-align: right; }
    .pill {
      display: inline-block;
      padding: .15rem .65rem;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--pill-fg);
      font-size: .85em;
      font-weight: 500;
      margin-right: .25rem;
    }
    .err {
      background: var(--err-bg);
      color: var(--err-fg);
      border: 1px solid var(--err-border);
      padding: .75rem 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>OAuth Connector</h1>
  <p class="muted">Universal OAuth → Provider data → Internal service enrichment.</p>

  <div id="signed-out">
    <p>Sign in to see your unified profile and repositories.</p>
    <a class="btn btn-primary" href="/auth/github">Login with GitHub</a>
  </div>

  <div id="signed-in" hidden>
    <div class="row">
      <h2 id="user-name" style="margin: 0; flex: 1;"></h2>
      <button id="logout">Logout</button>
    </div>
    <p>
      <span class="pill" id="user-license"></span>
      <span class="pill" id="user-role"></span>
      <span class="muted" id="user-id"></span>
    </p>
    <table id="repos">
      <thead><tr><th>Name</th><th>Description</th><th class="stars">Stars</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="error" class="err" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
