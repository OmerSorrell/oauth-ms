<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OAuth Connector — Universal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    button, .btn { font: inherit; padding: .55rem 1rem; border-radius: 8px; border: 1px solid #888; background: transparent; cursor: pointer; }
    .btn-primary { background: #2563eb; color: white; border-color: #2563eb; text-decoration: none; display: inline-block; }
    .row { display: flex; gap: .75rem; align-items: center; }
    .muted { color: #666; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    th { font-weight: 600; }
    .stars { font-variant-numeric: tabular-nums; text-align: right; }
    .pill { display: inline-block; padding: .1rem .55rem; border-radius: 999px; background: #eef; font-size: .85em; }
    .err { background: #fee; padding: .75rem 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>OAuth Connector</h1>
  <p class="muted">Universal OAuth → Provider data → Internal service enrichment.</p>

  <div id="signed-out">
    <p>Sign in to see your unified profile and repositories.</p>
    <a class="btn btn-primary" href="/auth/github">Login with GitHub</a>
  </div>

  <div id="signed-in" hidden>
    <div class="row">
      <h2 id="user-name" style="margin: 0; flex: 1;"></h2>
      <button id="logout">Logout</button>
    </div>
    <p>
      <span class="pill" id="user-license"></span>
      <span class="pill" id="user-role"></span>
      <span class="muted" id="user-id"></span>
    </p>
    <table id="repos">
      <thead><tr><th>Name</th><th>Description</th><th class="stars">Stars</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="error" class="err" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
